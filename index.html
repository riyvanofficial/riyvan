<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIYVAN — Wear Your Way</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f6f3ee;color:#171717}
button,input,select{font:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid #ddd}
.nav{max-width:1180px;margin:auto;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.logo{font-size:25px;font-weight:900;letter-spacing:4px}
.tag{font-size:11px;color:#777;letter-spacing:2px}
.navbtn{border:1px solid #222;background:#171717;color:#fff;padding:10px 15px;border-radius:7px}
.hero{max-width:1180px;margin:auto;padding:75px 20px 45px}
.hero h1{font-size:52px;margin:0 0 12px;letter-spacing:-2px}
.hero p{color:#666;max-width:520px;line-height:1.6}
.wrap{max-width:1180px;margin:auto;padding:0 20px 60px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:25px}
.tab{border:1px solid #ccc;background:#fff;padding:9px 15px;border-radius:20px}
.tab.active{background:#171717;color:white}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:#fff;border:1px solid #ddd;border-radius:10px;overflow:hidden}
.card img{width:100%;height:270px;object-fit:cover;background:#eee}
.cardbody{padding:15px}
.card h3{margin:0 0 8px}
.price{font-weight:bold;margin-bottom:12px}
.stock{font-size:12px;color:#777;margin-bottom:12px}
.buy{width:100%;border:0;background:#171717;color:#fff;padding:11px;border-radius:6px}
.empty{text-align:center;padding:50px;color:#777}
.admin{display:none;max-width:1180px;margin:30px auto;padding:20px;background:#fff;border:1px solid #ddd;border-radius:10px}
.admin.show{display:block}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:6px}
.formfull{grid-column:1/-1}
.admin button{border:0;background:#171717;color:#fff;padding:10px 15px;border-radius:6px}
.productrow{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid #ddd;padding:12px 0}
.delete{background:#b00020!important}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.box{background:#fff;border-radius:10px;padding:25px;width:100%;max-width:420px}
.box h2{margin-top:0}
.box input{margin-bottom:12px}
.close{float:right;background:none!important;color:#111!important;font-size:20px;padding:0!important}
footer{text-align:center;border-top:1px solid #ddd;padding:25px;color:#777}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:40px}}
@media(max-width:480px){.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}}
</style>
</head>

<body>

<header>
<div class="nav">
  <div>
    <div class="logo">RIYVAN</div>
    <div class="tag">WEAR YOUR WAY</div>
  </div>
  <button class="navbtn" onclick="openLogin()">Owner Login</button>
</div>
</header>

<section class="hero">
  <h1>WEAR YOUR WAY.</h1>
  <p>Premium everyday fashion by RIYVAN. Simple. Modern. Yours.</p>
</section>

<div class="wrap">

  <div class="tabs">
    <button class="tab active" onclick="filterProducts('All',this)">All</button>
    <button class="tab" onclick="filterProducts('T-Shirts',this)">T-Shirts</button>
    <button class="tab" onclick="filterProducts('Hoodies',this)">Hoodies</button>
    <button class="tab" onclick="filterProducts('Oversized',this)">Oversized</button>
  </div>

  <div id="products" class="grid">
    <div class="empty">Loading products...</div>
  </div>

</div>

<section id="adminPanel" class="admin">
  <h2>RIYVAN Store Admin</h2>
  <p id="loginStatus"></p>

  <form id="productForm" class="formgrid">
    <input id="pName" placeholder="Product name" required>
    <input id="pPrice" type="number" placeholder="Price" required>
    <input id="pStock" type="number" placeholder="Stock" required>
    <select id="pCategory">
      <option>T-Shirts</option>
      <option>Hoodies</option>
      <option>Oversized</option>
    </select>
    <input id="pImage" class="formfull" placeholder="Image URL (optional)">
    <button class="formfull" type="submit">Add Product</button>
  </form>

  <h3>Products</h3>
  <div id="adminProducts"></div>

  <button onclick="logout()" style="margin-top:15px">Logout</button>
</section>

<div id="loginModal" class="modal">
  <div class="box">
    <button class="close" onclick="closeLogin()">×</button>
    <h2>Owner Login</h2>

    <input id="email" type="email" placeholder="Owner email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()" style="width:100%">Login</button>

    <p id="loginMessage" style="font-size:13px;color:#777"></p>
  </div>
</div>

<footer>
RIYVAN © 2026 — WEAR YOUR WAY
</footer>

<script>
const SUPABASE_URL = "https://kdvgnuprprahkezbdfmg.supabase.co";

/*
IMPORTANT:
Paste your SUPABASE PUBLISHABLE KEY below.
DO NOT use the service_role/secret key.
*/
const SUPABASE_KEY = "sb_publishable_mnYqgS6i2QjrY5axODG6ig_UxaIL7Cl"

const OWNER_UID = "3db53ac5-4bb7-4e96-902a-8f7e04515c49";
const WHATSAPP = "918901214642";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allProducts = [];
let currentFilter = "All";

async function loadProducts(){
  const {data,error} = await db
    .from("products")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    document.getElementById("products").innerHTML =
      '<div class="empty">Unable to load products.</div>';
    console.error(error);
    return;
  }

  allProducts = data || [];
  renderProducts();
}

function renderProducts(){
  const box = document.getElementById("products");

  let products = allProducts;

  if(currentFilter !== "All"){
    products = products.filter(p => p.category === currentFilter);
  }

  if(!products.length){
    box.innerHTML = '<div class="empty">No products available yet.</div>';
    return;
  }

  box.innerHTML = products.map(p => `
    <div class="card">
      ${
        p.image_url
        ? `<img src="${escapeHtml(p.image_url)}" alt="${escapeHtml(p.name)}">`
        : `<div style="height:270px;background:#eee;display:flex;align-items:center;justify-content:center;color:#777">RIYVAN</div>`
      }

      <div class="cardbody">
        <h3>${escapeHtml(p.name)}</h3>
        <div class="price">₹${Number(p.price).toLocaleString("en-IN")}</div>
        <div class="stock">
          ${p.stock > 0 ? `${p.stock} available` : "Out of stock"}
        </div>

        <button
          class="buy"
          ${p.stock <= 0 ? "disabled" : ""}
          onclick="orderWhatsApp('${escapeJs(p.name)}',${p.price})">
          ${p.stock > 0 ? "Order on WhatsApp" : "Out of stock"}
        </button>
      </div>
    </div>
  `).join("");
}

function filterProducts(category,button){
  currentFilter = category;

  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  button.classList.add("active");

  renderProducts();
}

function orderWhatsApp(name,price){
  const message =
    `Hello RIYVAN 👋%0A%0AI want to order:%0AProduct: ${name}%0APrice: ₹${price}%0A%0APlease share the order details.`;

  window.open(`https://wa.me/${WHATSAPP}?text=${message}`,"_blank");
}

function openLogin(){
  document.getElementById("loginModal").classList.add("show");
}

function closeLogin(){
  document.getElementById("loginModal").classList.remove("show");
}

async function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const msg = document.getElementById("loginMessage");

  msg.textContent = "Logging in...";

  const {data,error} = await db.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    msg.textContent = error.message;
    return;
  }

  if(data.user.id !== OWNER_UID){
    await db.auth.signOut();
    msg.textContent = "This account is not the store owner.";
    return;
  }

  closeLogin();
  showAdmin(data.user);
}

async function showAdmin(user){
  document.getElementById("adminPanel").classList.add("show");
  document.getElementById("loginStatus").textContent =
    "Logged in as " + user.email;

  renderAdminProducts();

  window.scrollTo({
    top:document.getElementById("adminPanel").offsetTop - 80,
    behavior:"smooth"
  });
}

function renderAdminProducts(){
  const box = document.getElementById("adminProducts");

  if(!allProducts.length){
    box.innerHTML = "<p>No products yet.</p>";
    return;
  }

  box.innerHTML = allProducts.map(p => `
    <div class="productrow">
      <div>
        <b>${escapeHtml(p.name)}</b><br>
        ₹${Number(p.price).toLocaleString("en-IN")}
        · Stock: ${p.stock}
        · ${escapeHtml(p.category)}
      </div>

      <button class="delete" onclick="deleteProduct('${p.id}')">
        Delete
      </button>
    </div>
  `).join("");
}

document.getElementById("productForm").addEventListener("submit",async(e)=>{
  e.preventDefault();

  const {data:{user}} = await db.auth.getUser();

  if(!user || user.id !== OWNER_UID){
    alert("Owner login required.");
    return;
  }

  const product = {
    name:document.getElementById("pName").value.trim(),
    price:Number(document.getElementById("pPrice").value),
    stock:Number(document.getElementById("pStock").value),
    category:document.getElementById("pCategory").value,
    image_url:document.getElementById("pImage").value.trim()
  };

  const {error} = await db.from("products").insert(product);

  if(error){
    alert(error.message);
    return;
  }

  e.target.reset();
  await loadProducts();
  renderAdminProducts();

  alert("Product added successfully!");
});

async function deleteProduct(id){
  if(!confirm("Delete this product?")) return;

  const {data:{user}} = await db.auth.getUser();

  if(!user || user.id !== OWNER_UID){
    alert("Owner login required.");
    return;
  }

  const {error} = await db
    .from("products")
    .delete()
    .eq("id",id);

  if(error){
    alert(error.message);
    return;
  }

  await loadProducts();
  renderAdminProducts();
}

async function logout(){
  await db.auth.signOut();
  document.getElementById("adminPanel").classList.remove("show");
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escapeJs(value){
  return String(value ?? "")
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'")
    .replaceAll("\n"," ");
}

db.auth.onAuthStateChange((event,session)=>{
  if(session?.user?.id === OWNER_UID){
    showAdmin(session.user);
  }
});

loadProducts();
</script>

</body>
</html>
